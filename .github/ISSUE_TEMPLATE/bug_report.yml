name: Bug report
description: Report a reproducible issue in Sandport.
title: 'bug: '
labels: ['bug']
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue without including credentials or customer data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
